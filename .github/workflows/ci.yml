name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          package-manager-cache: false

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.19.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Unit tests
        run: pnpm test

      - name: TypeScript checkJs
        run: pnpm run typecheck

      - name: ESLint
        run: pnpm run lint

      - name: Build and validators
        run: pnpm run build

      - name: Build Pages artifact
        run: pnpm run build:pages

      - name: Validate Pages artifact
        run: pnpm run validate:pages

      - name: Install browser engines for repository-path E2E
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Full browser E2E
        run: pnpm run test:e2e

      - name: iPhone-first browser E2E
        run: pnpm run test:iphone

      - name: iPhone-first managed WebKit E2E
        env:
          WW_BROWSER_TYPE: webkit
        run: pnpm run test:iphone

      - name: GitHub Pages subpath E2E
        run: pnpm run test:pages

      - name: Capture iPhone QA screenshots
        env:
          WW_SCREENSHOT_BROWSER: chromium
        run: pnpm run capture:iphone

      - name: Upload iPhone QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: iphone-first-screenshots-chromium
          path: artifacts/qa/iphone-first
          retention-days: 14

      - name: Capture managed WebKit iPhone QA screenshots
        env:
          WW_SCREENSHOT_BROWSER: webkit
        run: pnpm run capture:iphone

      - name: Upload managed WebKit iPhone QA screenshots
        uses: actions/upload-artifact@v4
        with:
          name: iphone-first-screenshots-webkit
          path: artifacts/qa/iphone-first
          retention-days: 14
